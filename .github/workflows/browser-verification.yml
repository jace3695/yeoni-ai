name: Isolated browser verification
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      YEONI_COMPONENT_QA: '1'
      QA_SOUP_VARIANT: fixed
      NEXT_TELEMETRY_DISABLED: '1'
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.19.0
        package-manager-cache: false
    - name: Checkout the same fixed WebKit network library as the full suite
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: GNOME/libsoup
        ref: 25eac153004f777581ca2d95e31a02ca96844332
        path: .e2e/libsoup-source
        persist-credentials: 'false'
    - name: Run private verification with fixed status output
      run: node scripts/qa-private-orchestrator.mjs focused-components
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      CI: 'true'
      QA_SOUP_VARIANT: fixed
      NEXT_TELEMETRY_DISABLED: '1'
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.19.0
        package-manager-cache: false
    - name: Checkout official libsoup 3.6.6 source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: GNOME/libsoup
        ref: 25eac153004f777581ca2d95e31a02ca96844332
        path: .e2e/libsoup-source
        persist-credentials: 'false'
    - name: Run private verification with fixed status output
      run: node scripts/qa-private-orchestrator.mjs browser
